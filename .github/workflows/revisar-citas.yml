name: Revisar citas DIAN

on:
  schedule:
    # Revision cada 20 min. GitHub arranca con retraso, por eso el script espera
    # hasta la siguiente marca (:00, :20, :40 hora Colombia) si esta cerca.
    - cron: "*/20 * * * *"
  workflow_dispatch:          # permite ejecutarlo a mano desde GitHub

concurrency:                  # nunca dos revisiones al tiempo
  group: revisar-citas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # incluye la espera hasta la marca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/revisar-citas.yml
      - name: Cache del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Revisar cupos
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ORIGEN: Nube
          # resumen "sin citas" solo en la revision de la hora en punto; a mano, siempre
          NOTIFICAR_SIEMPRE: ${{ github.event_name == 'schedule' && 'hora' || '1' }}
          # al lanzarlo a mano revisa de inmediato, sin esperar la marca
          ESPERAR_HORA_EN_PUNTO: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python revisar_cupos.py
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-${{ github.run_number }}
          path: |
            historial_revisiones.csv
            analisis_revisiones.md
            cupo_encontrado.png
            seleccion.png
          if-no-files-found: ignore
          retention-days: 3
