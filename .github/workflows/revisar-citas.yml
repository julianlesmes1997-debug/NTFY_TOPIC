name: Revisar citas DIAN

on:
  schedule:
    # GitHub no cumple horarios cortos, asi que cada ejecucion revisa cada 5 min
    # durante 55 min (BUCLE_MINUTOS). Se programa cada 15 min para que siempre haya
    # una ejecucion en cola que arranque apenas termine la anterior (ver concurrency).
    - cron: "*/15 * * * *"
  workflow_dispatch:          # permite ejecutarlo a mano desde GitHub

concurrency:                  # nunca dos ejecuciones al tiempo; queda maximo una en cola
  group: revisar-citas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 70   # ciclo de 55 min + instalacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/revisar-citas.yml
      - name: Cache del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Revisar cupos
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ORIGEN: Nube
          # resumen "sin citas" solo en la revision de la hora en punto; a mano, siempre
          NOTIFICAR_SIEMPRE: ${{ github.event_name == 'schedule' && 'hora' || '1' }}
          # programado: ciclo de 55 min; a mano: una sola revision inmediata
          BUCLE_MINUTOS: ${{ github.event_name == 'schedule' && '55' || '0' }}
        run: python revisar_cupos.py
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-${{ github.run_number }}
          path: |
            historial_revisiones.csv
            analisis_revisiones.md
            cupo_encontrado.png
            seleccion.png
          if-no-files-found: ignore
          retention-days: 3
